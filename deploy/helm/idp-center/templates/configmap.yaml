apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "idp-center.fullname" . }}-config
  labels:
    {{- include "idp-center.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range $key, $value := .Values.configMap }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
